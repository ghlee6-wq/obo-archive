name: Refresh corrections feed for Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # UTC 00:17/06:17/12:17/18:17 = KST 09:17/15:17/21:17/03:17
    - cron: '17 0,6,12,18 * * *'

permissions:
  contents: write

concurrency:
  group: corrections-feed
  cancel-in-progress: false

jobs:
  collect-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start from latest main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect official corrections RSS
        id: update
        continue-on-error: true
        run: python scripts/update_feed.py
      - name: Save corrections data to main
        if: steps.update.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update corrections RSS metadata'
            git push origin main
          else
            echo "Feed unchanged. No deploy required."
          fi
